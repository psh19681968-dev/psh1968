<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>말씀의 숨결 · 설교문 생성기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="hero">
            <h1 class="hero-title">말씀의 숨결</h1>
            <p class="hero-subtitle">성경 본문과 주제를 입력하면,<br>
                편안하고 동기부여가 되는 설교문을 작성해 드립니다.</p>
            <p class="hero-note">※ 김병삼 목사님 스타일을 참고하여 작성됩니다.</p>
        </header>

        <section class="input-card">
            <div class="tab-row">
                <button class="tab active" data-type="topic">주제로 작성</button>
                <button class="tab" data-type="passage">본문으로 작성</button>
            </div>

            <div class="field-wrap">
                <label for="user-input" id="input-label">주제를 입력하세요</label>
                <textarea
                    id="user-input"
                    rows="3"
                    placeholder="예) 고난 가운데 누리는 평안"
                    autocomplete="off"
                ></textarea>
                <div class="examples" id="examples">
                    <span class="example-label">예시 :</span>
                    <button class="example-chip" data-value="고난 가운데 누리는 평안">고난 속 평안</button>
                    <button class="example-chip" data-value="하나님의 때를 기다리는 믿음">기다림의 믿음</button>
                    <button class="example-chip" data-value="관계의 회복과 용서">용서와 회복</button>
                    <button class="example-chip" data-value="일상 속 예배">일상의 예배</button>
                </div>
            </div>

            <button id="generate-btn" class="generate-btn">
                <span class="btn-text">설교문 작성 시작</span>
                <span class="btn-loader" aria-hidden="true"></span>
            </button>
        </section>

        <section id="output-section" class="output-section hidden">
            <div class="output-header">
                <h2>설교문</h2>
                <div class="output-actions">
                    <span id="status" class="status"></span>
                    <button id="copy-btn" class="action-btn" title="복사" disabled>복사</button>
                    <button id="download-btn" class="action-btn" title="텍스트 파일로 저장" disabled>저장</button>
                </div>
            </div>
            <article id="sermon-output" class="sermon-output"></article>
            <div id="usage-info" class="usage-info hidden"></div>
        </section>

        <footer class="footer">
            <p>말씀이 육신이 되어 우리 가운데 거하시매 (요 1:14)</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
